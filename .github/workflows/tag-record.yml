# The record of who pushed each release tag of aboveloop (L2-release §0).
# A tag push runs this from the tagged commit, and the run's actor is the person who pushed
# the tag. So the newest run of this workflow for a tag name is the record: a tag counts as a
# release only when that run's actor is the owner and its commit is the tag's commit now.
# Every project's loop.yml and prerelease read it (`gh api …/actions/workflows/tag-record.yml/runs`).
name: tag-record

on:
  push:
    tags: ["[0-9]*.[0-9]*"]

permissions: {}

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record
        env:
          TAG: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: echo "tag $TAG at $GITHUB_SHA pushed by $ACTOR"
