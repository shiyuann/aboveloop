# The workflow `loop.yml` of the aboveloop builder loop (aboveloop knowledge/spec/L3-loop-workflow.md §1).
# The skill setup-app copies this file, unchanged, to .github/workflows/loop.yml of each
# project repo. Change it in aboveloop (skills/setup-app/references/loop.yml), never in a copy.
# The work is the composite action services/loop of the latest release of aboveloop, checked
# out at that tag. It launches a Cursor agent with builder, step explore, for the open
# issues without the label explored, and step implement for the issue it chooses among those
# with the labels ready-for-auto-builder and explored.
# Variables: GH_APP_ID_DEV.
# Secrets: CURSOR_API_KEY, GH_APP_KEY_DEV (the GitHub App of the loop mints the run's GitHub tokens).
name: loop

on:
  schedule:
    - cron: "17 3,9,21 * * *" # explore + implement; with the next line, every 6 hours
    - cron: "17 15 * * *" # explore + implement
  workflow_dispatch:
    inputs:
      step:
        description: Which steps to run
        type: choice
        options: [all, explore, implement]
        default: all
      dry_run:
        description: Read everything, launch nothing
        type: boolean
        default: false

permissions:
  contents: read
  issues: read
  pull-requests: read

# One run at a time, and a newer queued run replaces a queued one.
concurrency:
  group: loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The owner and the name of the repo of aboveloop, for the kit token.
      - id: kitrepo
        run: |
          kit=shiyuann/aboveloop
          echo "owner=${kit%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${kit#*/}" >> "$GITHUB_OUTPUT"
      # Run the latest release of aboveloop, not its main (L2-release §0, §2.3; L3-loop-workflow §1
      # step 0): the release that aboveloop's repository variable RELEASE names, "<tag> <sha>". Only
      # the owner's prerelease writes it; no token of the loops can. A release tag that it does not
      # name is never read, whatever its version. It fails closed and never falls back to an older
      # tag: a variable that is missing (404), that cannot be read, or whose value has another form;
      # that tag gone (deleted), or not at the SHA of the variable (moved); or a SHA that main does
      # not reach: each stops the run. The check is here, not in the action that it examines.
      - id: kit
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GH_APP_ID_DEV }}
          private-key: ${{ secrets.GH_APP_KEY_DEV }}
          owner: ${{ steps.kitrepo.outputs.owner }}
          repositories: ${{ steps.kitrepo.outputs.name }}
          permission-contents: read
          # Variables read, to read RELEASE (L3-loop-workflow W14). The action does not declare this
          # input, so it warns "Unexpected input(s)", and still passes it on.
          permission-actions-variables: read
      - id: release
        name: The latest release of aboveloop
        env:
          GH_TOKEN: ${{ steps.kit.outputs.token }}
        run: |
          set -euo pipefail
          kit=shiyuann/aboveloop
          err="$(mktemp)"
          if ! value="$(gh api "repos/$kit/actions/variables/RELEASE" --jq .value 2>"$err")"; then
            echo "::error::the release variable RELEASE of aboveloop is missing or cannot be read ($(tr '\n' ' ' < "$err")): the loop does not run"; exit 1
          fi
          if ! [[ "$value" =~ ^[0-9]{8}\.[0-9]+\ [0-9a-f]{40}$ ]]; then
            echo "::error::the release variable RELEASE of aboveloop is not '<YYYYMMDD.N> <sha>' (a tag name, one space, a full SHA): the loop does not run"; exit 1
          fi
          name="${value% *}"
          sha="${value#* }"
          tag="$(gh api "repos/$kit/tags?per_page=100" --paginate --jq ".[] | select(.name == \"$name\") | .commit.sha")"
          if [ -z "$tag" ]; then echo "::error::the latest release $name is gone (deleted): the loop does not run, and it does not take an older tag"; exit 1; fi
          if [ "$tag" != "$sha" ]; then echo "::error::the latest release $name was moved: the variable names $sha, the tag is at $tag: the loop does not run, and it does not take an older tag"; exit 1; fi
          status="$(gh api "repos/$kit/compare/$sha...main" --jq .status)"
          case "$status" in
            identical|ahead) ;;
            *) echo "::error::the latest release $name is not on main ($status): the loop does not run"; exit 1 ;;
          esac
          echo "tag=$name" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "aboveloop $name ($sha), from the release variable RELEASE"
      - uses: actions/checkout@v4
        with:
          repository: shiyuann/aboveloop
          ref: ${{ steps.release.outputs.sha }}
          token: ${{ steps.kit.outputs.token }}
          path: .aboveloop
          persist-credentials: false
      - uses: ./.aboveloop/services/loop
        with:
          kit_tag: ${{ steps.release.outputs.tag }}
          kit_sha: ${{ steps.release.outputs.sha }}
          step: ${{ inputs.step }}
          dry_run: ${{ inputs.dry_run }}
          gh_app_id_dev: ${{ vars.GH_APP_ID_DEV }}
          cursor_api_key: ${{ secrets.CURSOR_API_KEY }}
          gh_app_key_dev: ${{ secrets.GH_APP_KEY_DEV }}
