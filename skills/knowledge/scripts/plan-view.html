<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan view</title>
<meta name="plan-view-token" content="__PLAN_VIEW_TOKEN__">
<!-- The page of plan-view.ts. Self-contained: no script or style from outside. It only draws: the server
     gives the plan, the node states, the critical path, the decisions and the activity, and it makes each edit.
     The token above is new at each start of the server; each POST sends it back. -->
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --line: #d9d9d4; --text: #1d1d1b; --muted: #6b6b66; --soft: #efefeb;
  --accent: #d1452f; --link: #2559c7; --ok: #2f8f4e; --wait: #c98a06; --bad: #c43333;
  --kA: #e3ecfb; --kD: #efe4fa; --kO: #fcebd9; --kE: #dcf2ef; --kM: #fbe1ec; --kI: #e6e8ef; --kX: #ececea;
  --sA: #4b78d0; --sD: #8d55c9; --sO: #d0782a; --sE: #2e9a8c; --sM: #c9497e; --sI: #5b6584; --sX: #8a8a85;
  --st-proposal: #0f8f86; --st-explore: #7a716b; --st-spec: #5b5ee6; --st-implement: #c47a06; --st-merge: #b02fc0; --st-release: #5c9410;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151615; --panel: #1e1f1e; --line: #393a38; --text: #e8e8e4; --muted: #9a9a94; --soft: #2a2b29;
    --accent: #ff7a5c; --link: #8fb0ff; --ok: #5cc27e; --wait: #f0b43a; --bad: #ff6b6b;
    --kA: #1f2a3d; --kD: #2c2238; --kO: #392a1b; --kE: #183330; --kM: #3a1f2b; --kI: #262934; --kX: #2a2a28;
    --sA: #7ea3ee; --sD: #b98ae9; --sO: #eda15b; --sE: #5cc8b8; --sM: #ea7dab; --sI: #9aa3c4; --sX: #a6a6a0;
    --st-proposal: #3cc9bd; --st-explore: #b2a9a2; --st-spec: #9b9dff; --st-implement: #f0b23e; --st-merge: #e07cf0; --st-release: #9ccf4f;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; display: flex; flex-direction: column; overflow-x: hidden; }
button, select, input { font: inherit; color: inherit; }
header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
header select { max-width: 340px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.now { flex: 1 1 260px; min-width: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search { position: relative; display: flex; align-items: center; gap: 4px; }
.results { position: absolute; top: 100%; left: 0; z-index: 5; margin: 4px 0 0; padding: 4px; list-style: none; width: 320px; max-width: 80vw; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.results li { padding: 4px 6px; border-radius: 5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.results li:hover, .results li.on { background: var(--soft); }
.search input { width: 200px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.search small { color: var(--muted); min-width: 3em; }
.badge { border: 1px solid var(--line); background: var(--soft); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
.badge.problem { background: var(--bad); border-color: var(--bad); color: #fff; }
.badge.question { background: var(--wait); border-color: var(--wait); color: #000; }
.live { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.live.on { background: var(--ok); }
/* Top to bottom: the metadata and the progress, the graph, the tabs. */
main { display: flex; flex-direction: column; gap: 10px; padding: 10px 12px 24px; min-width: 0; }
h2.sub { margin: 0; font-size: 11px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
#progress { display: flex; align-items: flex-start; gap: 12px; }
#progress h2 { width: 76px; flex: none; padding-top: 3px; }
#progressBody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 0; padding: 0; list-style: none; }
.chain li { display: flex; align-items: center; gap: 4px; }
.chain .sep { color: var(--muted); }
.step { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); }
.step i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.step small { font-size: 10.5px; }
.step.past { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: color-mix(in srgb, var(--ok) 9%, transparent); }
.step.current { color: var(--text); font-weight: 650; border-color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); box-shadow: 0 0 0 1px var(--c); }
.counts { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); }
.counts b { color: var(--text); font-weight: 600; }
#graphWrap { position: relative; height: 340px; min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
#graph { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; user-select: none; }
#graph.panning { cursor: grabbing; }
.tools { position: absolute; top: 8px; right: 8px; z-index: 5; display: flex; gap: 3px; }
.tools button { position: relative; width: 26px; height: 26px; padding: 0; border-radius: 6px; border: 1px solid var(--line); background: var(--soft); cursor: pointer; font-size: 13px; line-height: 1; }
.tools button:hover { background: color-mix(in srgb, var(--link) 18%, var(--soft)); }
.tools button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
/* A text tooltip, on hover and on focus. */
[data-tip]:hover::after, [data-tip]:focus-visible::after { content: attr(data-tip); position: absolute; top: calc(100% + 6px); right: 0; z-index: 6; padding: 3px 7px; border-radius: 5px; background: var(--text); color: var(--bg); font-size: 11px; white-space: nowrap; pointer-events: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: -4px; padding: 0 4px; color: var(--muted); font-size: 11px; }
.pager { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 3px; border: 2px solid var(--line); }
.empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
/* The detail of the selected node or area: over the right 30% of the graph. */
#detail { position: absolute; top: 0; right: 0; bottom: 0; width: 30%; min-width: 256px; max-width: 100%; z-index: 4; background: var(--panel); border-left: 1px solid var(--line); box-shadow: -4px 0 14px rgba(0,0,0,.12); overflow: auto; padding: 10px 12px 16px; }
#detail .close { position: sticky; top: 0; float: right; width: 24px; height: 24px; border: 1px solid var(--line); border-radius: 6px; background: var(--soft); cursor: pointer; }
#detail:not([hidden]) ~ .tools { right: max(calc(30% + 8px), 264px); }
#below { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { padding: 8px 14px; border: 0; border-bottom: 2px solid transparent; background: none; cursor: pointer; color: var(--muted); }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
#pane { padding: 10px 12px 16px; overflow-wrap: anywhere; }
.only { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; color: var(--muted); }
@media (max-width: 800px) {
  main { padding: 8px; }
  #progress { flex-direction: column; gap: 4px; }
  .search input { width: 140px; }
  #detail:not([hidden]) ~ .tools { right: 8px; top: auto; bottom: 8px; }
}

/* graph */
.band rect { fill: color-mix(in srgb, var(--c) 7%, transparent); stroke: color-mix(in srgb, var(--c) 22%, transparent); }
.band text { font-size: 11px; fill: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.band .sw { fill: var(--c); stroke: none; }
.band.current text { fill: var(--text); font-weight: 750; }
.band.current rect { stroke: var(--c); stroke-width: 1.5; }
.edge { fill: none; stroke: var(--muted); stroke-width: 1.3; opacity: .7; }
.edge.crit { stroke: var(--accent); stroke-width: 2.4; opacity: 1; }
.edge.hl { stroke: var(--link); stroke-width: 2.2; opacity: 1; }
.edge.dim { opacity: .2; }
.edge.past { stroke-dasharray: 4 3; opacity: .45; }
.node .box { stroke-width: 1.5; rx: 8; fill: var(--panel); stroke: var(--line); }
.node .card { height: 100%; padding: 5px 8px; overflow: hidden; font-size: 11.5px; line-height: 1.3; color: var(--text); cursor: pointer; }
.node .code { font-weight: 650; font-size: 11px; display: flex; gap: 6px; align-items: center; }
.node .st { font-weight: 500; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .03em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .tag { font-size: 9.5px; font-weight: 700; padding: 0 5px; border-radius: 4px; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); }
.node .label { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.node.done .card { opacity: .55; }
.node.done .box { stroke: color-mix(in srgb, var(--ok) 45%, var(--line)); fill: color-mix(in srgb, var(--ok) 6%, var(--panel)); }
.node.dropped .card { opacity: .45; text-decoration: line-through; }
.node.dropped .box { stroke-dasharray: 4 3; }
.node.ready .box { stroke: var(--ok); stroke-width: 2; }
.node.waits .box { stroke: var(--wait); stroke-width: 3; animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { filter: drop-shadow(0 0 1px var(--wait)); } 50% { filter: drop-shadow(0 0 7px var(--wait)); } }
@media (prefers-reduced-motion: reduce) { .node.waits .box { animation: none; filter: drop-shadow(0 0 4px var(--wait)); } }
.node.crit .box { stroke: var(--accent); stroke-width: 2.5; }
.node.waits.crit .box { stroke: var(--wait); }
.node.match .box { stroke: var(--link); stroke-width: 3; stroke-dasharray: none; }
.node.sel .box { stroke: var(--link); stroke-width: 3.5; }
.node.faded { opacity: .35; }

.group .gline { fill: none; stroke: var(--link); stroke-width: 2.5; stroke-dasharray: 7 4; }
.group.issue .gline { stroke: var(--ok); stroke-dasharray: none; }
.group.sel .gline { stroke-width: 5; }
.group .glabel { font-size: 11px; line-height: 15px; padding: 2px 8px; cursor: pointer; }
.group .glabel div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.group .gname { font-weight: 650; color: var(--link); }
.group.issue .gname { color: var(--ok); }
.group .gname a { color: inherit; }
.group .gstate { color: var(--muted); font-size: 10.5px; }
.node.picked .box { stroke: var(--link); stroke-width: 3; stroke-dasharray: 5 3; }
.lasso { fill: color-mix(in srgb, var(--link) 12%, transparent); stroke: var(--link); stroke-dasharray: 4 3; }
.pickbar { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; box-shadow: 0 2px 10px rgba(0,0,0,.15); max-width: calc(100% - 20px); }
.pickbar input { padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); width: 220px; max-width: 50vw; }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.btn.primary { background: var(--link); border-color: var(--link); color: #fff; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.confirm { border: 1px solid var(--wait); border-radius: 8px; padding: 8px; margin: 8px 0; }
.confirm pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--soft); padding: 6px 8px; border-radius: 6px; font-size: 11.5px; max-height: 260px; overflow: auto; }
.msg { padding: 6px 8px; border-radius: 6px; margin-bottom: 8px; background: var(--soft); }
.msg.err { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.chip .x { margin-left: 4px; color: var(--bad); cursor: pointer; font-weight: 700; }

/* panes */
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 10px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 1px 9px; cursor: pointer; font-size: 12px; }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.code-chip { font-weight: 650; border-radius: 4px; padding: 0 5px; background: var(--soft); cursor: pointer; white-space: nowrap; }
ul.events, ul.plain { list-style: none; margin: 0; padding: 0; }
.events li { padding: 7px 4px; border-bottom: 1px solid var(--soft); cursor: pointer; }
.events li:hover { background: var(--soft); }
.events .meta { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.kind { display: inline-block; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; padding: 0 5px; border-radius: 4px; margin-right: 4px; background: var(--soft); color: var(--muted); }
.kind.answer { background: var(--kD); color: var(--sD); } .kind.done, .kind.tick { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.kind.drop, .kind.remove, .kind.arrow-remove { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.kind.add, .kind.arrow-add { background: var(--kA); color: var(--sA); } .kind.now, .kind.log { background: var(--kE); color: var(--sE); }
.kind.propose, .kind.regroup { background: color-mix(in srgb, var(--link) 15%, transparent); color: var(--link); } .kind.issue { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.kind.unpropose { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
blockquote, .quote { margin: 4px 0; padding: 2px 10px; border-left: 3px solid var(--line); color: var(--muted); }
.card-d { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
.card-d h4 { margin: 0 0 4px; font-size: 13px; }
.card-d dl { margin: 4px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 2px 8px; }
.card-d dt { color: var(--muted); }
.card-d dd { margin: 0; }
.state { font-size: 10.5px; font-weight: 600; text-transform: uppercase; padding: 0 5px; border-radius: 4px; background: var(--soft); color: var(--muted); }
.state.ready { color: var(--ok); } .state.waits { color: var(--wait); } .state.done { color: var(--muted); }
.detail h3 { margin: 0 0 2px; font-size: 15px; }
.detail .sub { color: var(--muted); margin-bottom: 8px; }
.detail h5 { margin: 12px 0 4px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.md { overflow-wrap: anywhere; }
.md h1, .md h2, .md h3, .md h4 { font-size: 13px; margin: 10px 0 4px; }
.md ul, .md ol { padding-left: 18px; margin: 4px 0; }
.md li.task { list-style: none; margin-left: -18px; }
.md p { margin: 4px 0; }
.md code { background: var(--soft); padding: 0 3px; border-radius: 3px; font-size: 12px; }
.md pre { background: var(--soft); padding: 6px 8px; border-radius: 6px; overflow: auto; }
.md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; margin: 4px 0; } .md td, .md th { border: 1px solid var(--line); padding: 2px 6px; }
a { color: var(--link); }
.finding { padding: 6px 4px; border-bottom: 1px solid var(--soft); cursor: pointer; }
.finding:hover { background: var(--soft); }
.muted { color: var(--muted); }
</style>
</head>
<body>
<header>
  <select id="plan" aria-label="Plan"></select>
  <div class="now" id="now"></div>
  <div class="search"><input id="search" type="search" placeholder="Search (/)" aria-label="Search nodes" autocomplete="off"><small id="searchCount"></small><ul class="results" id="results" hidden></ul></div>
  <button class="badge" id="findings" title="Findings of the plan check">0</button>
  <span class="live" id="live" title="Live updates"></span>
</header>
<main>
  <section id="progress" aria-label="Progress"><h2 class="sub">Progress</h2><div id="progressBody"></div></section>
  <section id="graphWrap" aria-label="Plan graph">
    <svg id="graph" aria-label="Plan graph">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>
        <marker id="arrowCrit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
        <marker id="arrowHl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--link)"/></marker>
      </defs>
      <g id="viewport"><g id="bands"></g><g id="groups"></g><g id="edges"></g><g id="nodes"></g><rect id="lasso" class="lasso" style="display:none"></rect></g>
    </svg>
    <aside id="detail" hidden><button class="close" id="closeDetail" aria-label="Close the detail" title="Close (Esc)">×</button><div id="detailBody"></div></aside>
    <div class="tools">
      <button id="allArrows" data-tip="All arrows (a)" aria-label="All arrows" aria-pressed="false">⇉</button>
      <button id="zoomIn" data-tip="Zoom in (+)" aria-label="Zoom in">+</button>
      <button id="zoomOut" data-tip="Zoom out (-)" aria-label="Zoom out">−</button>
      <button id="fit" data-tip="Fit the graph (0)" aria-label="Fit the graph">⤢</button>
      <button id="follow" data-tip="Follow new activity (f)" aria-label="Follow new activity" aria-pressed="true">◎</button>
    </div>
    <div class="pickbar" id="pickbar" hidden></div>
    <div class="empty" id="empty" hidden></div>
  </section>
  <div class="legend" id="legend"></div>
  <section id="below" aria-label="Activity">
    <nav class="tabs" id="tabs">
      <button data-tab="activity">Activity</button>
      <button data-tab="decisions">Decisions</button>
      <button data-tab="findings">Findings</button>
    </nav>
    <div id="pane"></div>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const SVG = "http://www.w3.org/2000/svg";
/** The size of a node: the server's layout gives it with each plan. */
let W = 172, H = 66;
/** The strip at the top of the frame where the tools are: Fit leaves it free. */
const TOOLS_H = 34;
/** The rows of a page of Activity. */
const PAGE = 25;
const KIND = { A: "agent", D: "owner decides", O: "owner step", E: "outside event", M: "milestone", I: "issue", X: "other" };
const FILTERS = {
  all: null,
  decisions: ["answer"],
  ticks: ["done", "tick"],
  adds: ["add", "arrow-add"],
  drops: ["drop", "remove", "arrow-remove"],
  log: ["log", "now"],
  groups: ["propose", "regroup", "unpropose", "issue"],
};

const S = {
  plans: [], file: null, data: null, pos: new Map(), size: { w: 0, h: 0 },
  tf: { x: 0, y: 0, k: 1 }, follow: true, all: false, sel: null, tab: "activity", filter: "all", page: 0,
  seen: new Set(), search: { q: "", list: [], at: -1 },
  picked: new Set(), selGroup: null, confirm: null, msg: null,
};
const TOKEN = document.querySelector('meta[name="plan-view-token"]').content;

// ---------- small helpers ----------
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const node = (code) => S.data?.plan.nodes.find((n) => n.code === code) ?? null;
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
function svgEl(tag, attrs = {}) {
  const e = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}
function ago(iso) {
  if (!iso) return "";
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.round(s / 60)}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  if (s < 86400 * 30) return `${Math.round(s / 86400)}d ago`;
  return iso.slice(0, 10);
}
const json = async (url) => {
  const r = await fetch(url);
  const body = await r.json();
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
};

// ---------- a small safe Markdown renderer: HTML is escaped first ----------
function inline(src) {
  return esc(src).split(/(`[^`]+`)/).map((part) => {

const groupName = (g) => (g.kind === "issue" ? `#${g.issue}` : g.code);
const shq = (a) => (/^[\w@%+=:,./-]+$/.test(a) ? a : `'${a.replace(/'/g, "'\\''")}'`);

/** A POST of an edit: the token of this start, the current file. */
async function edit(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json", "x-plan-view-token": TOKEN }, body: JSON.stringify({ file: S.file, ...body }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}
/** An edit, then a reload of the plan; an error shows in the detail. */
async function act(path, body, done) {
  try {
    const d = await edit(path, body);
    S.msg = null;
    if (done) done(d);
    await loadPlan(S.file, true);
  } catch (err) {
    S.msg = { err: true, text: String(err.message || err) };
    renderPane();
  }
}

/** The bar of the nodes selected with shift: make a proposal of them. */
function renderPickbar() {
  const bar = $("pickbar");
  const n = S.picked.size;
  bar.hidden = n === 0;
  if (!n || !S.data) return;
  const codes = [...S.picked];
  const clear = el("button", { class: "btn", onclick: () => { S.picked.clear(); paintMarks(); renderPane(); } }, "Clear");
  const what = el("span", {}, `${n} selected: ${codes.join(", ")}`);
  if (!S.data.editable || S.data.plan.kind !== "milestone") {
    bar.replaceChildren(what, el("span", { class: "muted" }, S.data.editable ? "only a milestone plan has proposals" : "editing is off"), clear);
    return;
  }
  const title = el("input", { placeholder: "Title of the proposal", "aria-label": "Title of the proposal" });
  const go = el("button", { class: "btn primary", onclick: () => {
    if (!title.value.trim()) return title.focus();
    act("/api/propose", { codes, title: title.value.trim() }, (d) => { S.picked.clear(); S.selGroup = d.code; S.sel = null; S.msg = { text: `${d.code} proposed.` }; });
  } }, "Propose");
  title.addEventListener("keydown", (e) => { if (e.key === "Enter") go.click(); });
  bar.replaceChildren(what, title, go, clear);
}

const codeChip = (code) => el("span", { class: "code-chip", onclick: (e) => { e.stopPropagation(); focusNode(code); } }, code);

function eventItem(e) {
  const meta = e.source === "commit"
    ? `${e.sha.slice(0, 7)} · ${e.subject} · ${ago(e.date)}`
    : e.source === "uncommitted" ? `uncommitted · ${ago(e.date)}` : `plan log${e.date ? ` · ${e.date.slice(0, 10)}` : ""}`;
  return el("li", { onclick: () => e.node && focusNode(e.node), title: e.date ?? "" },
    el("div", {}, el("span", { class: `kind ${e.kind}` }, e.kind), e.node ? codeChip(e.node) : null, " ", e.text),
    e.quote ? el("div", { class: "quote" }, `「${e.quote}」`) : null,
    el("div", { class: "meta" }, meta));
}

function renderActivity(pane) {
  const chips = el("div", { class: "chips" }, Object.keys(FILTERS).map((f) =>
    el("button", { class: `chip${S.filter === f ? " on" : ""}`, onclick: () => { S.filter = f; S.page = 0; renderPane(); } }, f)));
  const kinds = FILTERS[S.filter];
  // A selected node or area: only its rows.
  const g = group(S.selGroup);
  const mine = S.sel ? (e) => e.node === S.sel || e.from === S.sel || e.to === S.sel : g ? (e) => e.group === g.code || g.nodes.includes(e.node) : null;
  const list = S.data.activity.filter((e) => (!kinds || kinds.includes(e.kind)) && (!mine || mine(e)));
  const only = mine ? el("div", { class: "only" }, `Only the rows of ${S.sel ?? groupName(g)}`, el("button", { class: "btn", onclick: () => select(null) }, "Show all")) : null;
  if (only) pane.append(only);
  pane.prepend(chips);
  // Pages of 25 rows.
  const pages = Math.max(1, Math.ceil(list.length / PAGE));
  S.page = Math.min(S.page, pages - 1);
  const from = S.page * PAGE;
  pane.append(list.length ? el("ul", { class: "events" }, list.slice(from, from + PAGE).map(eventItem)) : el("p", { class: "muted" }, "No events."));
  if (pages > 1) pane.append(el("div", { class: "pager" },
    el("button", { class: "btn", disabled: S.page === 0 ? "" : null, onclick: () => { S.page--; renderPane(); } }, "‹ Previous"),
    el("span", {}, `${from + 1}–${Math.min(from + PAGE, list.length)} of ${list.length}`),
    el("button", { class: "btn", disabled: S.page === pages - 1 ? "" : null, onclick: () => { S.page++; renderPane(); } }, "Next ›")));
}

function renderDecisions(pane) {
  const ds = S.data.view.decisions;
  if (!ds.length) return pane.append(el("p", { class: "muted" }, "This plan has no D node."));
  for (const d of ds) {
    const rows = [["Question", d.question]];
    if (d.recommended) rows.push(["Recommended", d.recommended]);
    if (d.answered) {
      rows.push(["Answer", d.answer ?? "✅"]);
      if (d.quote) rows.push(["Quote", `「${d.quote}」`]);
      if (d.by) rows.push(["By", `${d.by}${d.date ? ` · ${d.date.slice(0, 10)}` : ""}`]);
    }
    pane.append(el("div", { class: "card-d" },
      el("h4", {}, codeChip(d.code), " ", el("span", { class: `state ${d.state}` }, d.answered ? "answered" : d.state), " ", d.label.replace(/^\S+\s*/, "")),
      el("dl", {}, rows.flatMap(([k, v]) => [el("dt", {}, k), el("dd", {}, v)]))));
  }
}

function renderFindings(pane) {
  const fs = S.data.findings;
  if (!fs.length) return pane.append(el("p", { class: "muted" }, "The plan check found nothing."));
  pane.append(el("div", {}, fs.map((f) => el("div", { class: "finding", onclick: () => focusNode(f.node) },
    el("span", { class: `kind ${f.kind === "problem" ? "drop" : "now"}` }, f.kind), f.node ? codeChip(f.node) : null, " ", f.text,
    el("div", { class: "meta muted" }, f.where)))));
}

function renderGroup(pane, g) {
  const ed = S.data.editable && g.kind === "proposal";
  const members = el("div", { class: "chips" }, g.nodes.map((c) => {
    const chip = el("span", { class: "chip", onclick: () => focusNode(c) }, c);
    if (ed) chip.append(el("span", { class: "x", title: `Remove ${c} from ${g.code}`, onclick: (e) => { e.stopPropagation(); act("/api/regroup", { code: g.code, remove: [c] }); } }, "×"));
    return chip;
  }));
  const adds = [...S.picked].filter((c) => !g.nodes.includes(c));
  const actions = el("div", { class: "actions" });
  if (ed) {
    if (adds.length) actions.append(el("button", { class: "btn", onclick: () => act("/api/regroup", { code: g.code, add: adds }, () => S.picked.clear()) }, `Add ${adds.join(", ")}`));
    actions.append(
      el("button", { class: "btn primary", onclick: async () => {
        try { const d = await edit("/api/open-issue", { code: g.code }); S.confirm = { code: g.code, command: d.command, diff: d.diff }; S.msg = null; }
        catch (err) { S.msg = { err: true, text: String(err.message || err) }; }
        renderPane();
      } }, "Open as issue…"),
      el("button", { class: "btn danger", onclick: () => act("/api/unpropose", { code: g.code }, () => { S.selGroup = null; S.msg = { text: `${g.code} removed.` }; }) }, "Remove proposal"));
  }
  const confirm = S.confirm && S.confirm.code === g.code
    ? el("div", { class: "confirm" },
        el("div", {}, "This runs, in the repo of the plan:"),
        el("pre", {}, S.confirm.command.map(shq).join(" ")),
        el("div", {}, "Then the plan changes (N is the number of the new issue):"),
        el("pre", {}, (S.confirm.diff ?? []).join("\n")),
        el("div", { class: "actions" },
          el("button", { class: "btn primary", onclick: (e) => {
            e.target.disabled = true;
            act("/api/open-issue", { code: g.code, confirm: true, expect: S.confirm.command }, (d) => {
              S.confirm = null;
              const where = d.url ?? `#${d.issue}`;
              if (d.written) { S.selGroup = `I${d.issue}`; S.msg = { text: `Opened #${d.issue}: ${where}` }; return; }
              // gh made the issue, but the edit of the plan added a problem: the plan is not written.
              const problems = (d.findings ?? []).filter((f) => f.kind === "problem").map((f) => f.text).join("; ");
              S.msg = { err: true, text: `The issue ${where} is open on GitHub, but the plan was NOT written: ${problems}. Record #${d.issue} in the plan (plan.ts open-issue cannot run again: the issue exists).` };
            });
          } }, "Run it"),
          el("button", { class: "btn", onclick: () => { S.confirm = null; renderPane(); } }, "Cancel")))
    : null;
  const link = g.kind === "issue" && S.data.github
    ? el("a", { href: `https://github.com/${S.data.github}/issues/${g.issue}`, target: "_blank", rel: "noopener noreferrer" }, `#${g.issue} on GitHub`) : null;
  const timeline = S.data.activity.filter((e) => e.group === g.code);
  const gs = S.data.view.stages.groups[g.code];
  const fact = gs?.issue;
  const plan = fact ? el("div", {},
    "Its plan: ", fact.where === "worktree" ? el("a", { href: `#file=${encodeURIComponent(fact.file)}` }, fact.file) : `${fact.file} on ${fact.ref}`,
    " · stage ", el("span", { class: "state", style: `color:var(--st-${fact.stage})` }, fact.stage),
    fact.next.length ? el("ul", { class: "plain" }, fact.next.map((x) => el("li", {}, el("span", { class: `state ${x.state}` }, x.state), " ", x.label))) : null) : null;
  pane.append(el("div", { class: "detail" },
    el("h3", {}, groupName(g), " ", el("span", { class: "state" }, g.kind), gs ? [" · stage ", el("span", { class: "state", style: `color:var(--st-${gs.stage})` }, gs.stage)] : null),
    el("div", {}, g.title), link,
    gs && !fact ? el("div", { class: "muted" }, groupState(g, gs)) : null, plan,
    gs?.openBefore.length ? [el("h5", {}, "Blocked by"), el("div", { class: "chips" }, gs.openBefore.map(codeChip))] : null,
    el("h5", {}, `Nodes · ${g.nodes.length}`), members,
    actions, confirm,
    !S.data.editable ? el("div", { class: "muted" }, "Editing is off.") : null,
    el("h5", {}, "Timeline"),
    timeline.length ? el("ul", { class: "events" }, timeline.map(eventItem)) : el("div", { class: "muted" }, "No events.")));
}

function renderNode(pane) {
  if (S.msg) pane.append(el("div", { class: `msg${S.msg.err ? " err" : ""}` }, S.msg.text));
  const g = group(S.selGroup);
  if (g) return renderGroup(pane, g);
  const n = node(S.sel);
  if (!n) return;
  const st = S.data.view.states[n.code];
  const stage = S.data.view.stages.nodes[n.code];
  const crit = S.data.view.critical.includes(n.code);
  const ins = S.data.plan.edges.filter((e) => e.to === n.code).map((e) => e.from);
  const outs = S.data.plan.edges.filter((e) => e.from === n.code).map((e) => e.to);
  const checked = n.items.filter((i) => i.checked).length;
  const body = el("div", { class: "md" });
  body.innerHTML = md(n.section?.body ?? ""); // md() escapes every character of the source first
  const timeline = S.data.activity.filter((e) => e.node === n.code || e.from === n.code);
  pane.append(el("div", { class: "detail" },
    el("h3", {}, n.code),
    el("div", { class: "sub" }, KIND[n.kind] ?? n.kind, " · ", el("span", { class: `state ${st}` }, st), " · stage ", el("span", { class: "state", style: `color:var(--st-${stage})` }, stage), crit ? el("span", { class: "state", style: "color:var(--accent)" }, " critical path") : null),
    el("div", {}, n.label),
    n.group && group(n.group) ? el("div", { class: "chips", style: "margin-top:6px" }, el("span", { class: "chip", onclick: () => selectGroup(n.group) }, `in ${groupName(group(n.group))}`)) : null,
    el("h5", {}, "Waits on"), ins.length ? el("ul", { class: "plain" }, ins.map((c) => el("li", {}, codeChip(c), " ", el("span", { class: `state ${S.data.view.states[c]}` }, S.data.view.states[c]), " ", node(c)?.label.replace(/^\S+\s*/, "") ?? ""))) : el("div", { class: "muted" }, "—"),
    el("h5", {}, "Next"), outs.length ? el("div", { class: "chips" }, outs.map(codeChip)) : el("div", { class: "muted" }, "—"),
    n.items.length ? el("h5", {}, `Items · ${checked}/${n.items.length} checked`) : null,
    n.section ? [el("h5", {}, `Section · line ${n.section.line}`), body] : el("p", { class: "muted" }, "No section."),
    el("h5", {}, "Timeline"),
    timeline.length ? el("ul", { class: "events" }, timeline.map(eventItem)) : el("div", { class: "muted" }, "No events.")));
}

/** The tab below the graph, and the detail over it. */
function renderPane() {
  const pane = $("pane"), detail = $("detailBody");
  pane.replaceChildren(); detail.replaceChildren();
  $("detail").hidden = !S.data || !(S.sel || S.selGroup || S.msg);
  sizeFrame();
  if (!S.data) return;
  ({ activity: renderActivity, decisions: renderDecisions, findings: renderFindings })[S.tab](pane);
  if (!$("detail").hidden) renderNode(detail);
}

/** Progress: the chain of the stages (done before the stage now, the stage now, after it), then the counts. */
function renderProgress() {
  const p = S.data.view.progress;
  const chain = el("ol", { class: "chain", "aria-label": "Stages" }, p.steps.map((s, i) => el("li", {},
    i ? el("span", { class: "sep", "aria-hidden": "true" }, "›") : null,
    el("span", { class: `step ${s.position}`, style: `--c: var(--st-${s.stage})`, "aria-current": s.position === "current" ? "step" : null, title: `${s.done} of ${s.total} nodes done` },
      el("i"), s.position === "past" ? "✓ " : null, s.stage, s.total ? el("small", {}, ` ${s.done}/${s.total}`) : null))));
  const chips = (list) => list.map((n) => el("span", { class: "code-chip", title: n.label, onclick: () => focusNode(n.code) }, n.code));
  const counts = el("div", { class: "counts" },
    el("span", {}, el("b", {}, `${p.done} of ${p.total}`), " nodes done"),
    p.waits.length ? el("span", {}, el("b", {}, "Waits"), " on ", p.waits.flatMap((n) => [...chips([n]), ` ${KIND[n.kind] ?? n.kind} `])) : null,
    p.ready.length ? el("span", {}, el("b", {}, "Can be done now"), " ", chips(p.ready)) : null,
    p.blocked ? el("span", {}, el("b", {}, String(p.blocked)), " blocked") : null);
  $("progressBody").replaceChildren(chain, counts);
}

function renderHeader() {
  const { plan, findings } = S.data;
  $("now").textContent = plan.now ? `Now: ${plan.now}` : (plan.update ?? plan.title).replace(/^>\s*/, "").replace(/\*\*/g, "");
  $("now").title = $("now").textContent;
  const problems = findings.filter((f) => f.kind === "problem").length;
  const b = $("findings");
  b.textContent = `${findings.length} finding${findings.length === 1 ? "" : "s"}`;
  b.className = `badge${problems ? " problem" : findings.length ? " question" : ""}`;
  document.title = `${plan.title} · Plan view`;
}
$("findings").onclick = () => { setTab("findings"); $("below").scrollIntoView({ behavior: "smooth", block: "start" }); };

$("legend").innerHTML = [["ready", "var(--ok)"], ["waits", "var(--wait)"], ["blocked", "var(--line)"], ["critical path", "var(--accent)"], ["done", "var(--muted)"]]
  .map(([t, c]) => `<span><i style="border-color:${c}"></i>${t}</span>`).join("") +
  `<span><i style="border-color:var(--link);border-style:dashed"></i>proposal</span><span><i style="border-color:var(--ok)"></i>issue</span>` +
  `<span>${Object.entries(KIND).filter(([k]) => k !== "X").map(([k, t]) => `${k} ${t}`).join(" · ")}</span>`;

// ---------- data ----------
async function loadPlans() {
  const { plans } = await json("/api/plans");
  S.plans = plans;
  const sel = $("plan");
  sel.replaceChildren(...plans.map((p) => el("option", { value: p.file }, `${p.title}  (${p.done}/${p.done + p.open})${p.error ? " — cannot parse" : ""}`)));
  if (S.file) sel.value = S.file;
}

/** Load the plan. `live`: a change came from the event stream, so new events pulse and follow moves. */
async function loadPlan(file, live = false) {
  let data;
  try {
    data = await json(`/api/plan?file=${encodeURIComponent(file)}`);
  } catch (err) {
    $("empty").hidden = false; $("empty").textContent = String(err.message || err);
    return;
  }
  const first = S.file !== file || !S.data;
  S.file = file; S.data = data;
  $("plan").value = file;
  if (location.hash !== `#file=${encodeURIComponent(file)}`) history.replaceState(null, "", `#file=${encodeURIComponent(file)}`);
  if (first) { S.sel = null; S.selGroup = null; S.picked = new Set(); S.seen = new Set(); S.msg = null; S.page = 0; }
  if (S.sel && !node(S.sel)) S.sel = null;
  if (S.selGroup && !group(S.selGroup)) S.selGroup = null;
  for (const c of S.picked) if (!node(c)) S.picked.delete(c);
  renderHeader();
  renderProgress();
  renderGraph();
  runSearch();
  renderPane();
  const fresh = data.activity.filter((e) => !S.seen.has(e.id));
  data.activity.forEach((e) => S.seen.add(e.id));
  if (first) {
    fitView(false);
    const c = S.follow && newestNode(data.activity);
    if (c) centerOn(c, false);
    return;
  }
  if (!live || !fresh.length) return;
  const c = S.follow && newestNode(fresh);
  if (c) centerOn(c);
}

function listen() {
  const es = new EventSource("/api/events");
  let timer = 0;
  es.addEventListener("hello", () => $("live").classList.add("on"));
  es.addEventListener("changed", (m) => {
    const d = JSON.parse(m.data);
    clearTimeout(timer);
    timer = setTimeout(() => {
      loadPlans().catch(() => {});
      if (S.file && (d.file === null || d.file === S.file)) loadPlan(S.file, true);
    }, 80);
  });
  es.onerror = () => $("live").classList.remove("on");
  es.onopen = () => { $("live").classList.add("on"); if (S.file && S.data) loadPlan(S.file, true); };
}

$("plan").addEventListener("change", (e) => loadPlan(e.target.value));
window.addEventListener("hashchange", () => {
  const f = decodeURIComponent((/^#file=(.*)$/.exec(location.hash) ?? [])[1] ?? "");
  if (f && f !== S.file) loadPlan(f);
});

(async function start() {
  setFollow(true);
  setTab("activity");
  try {
    await loadPlans();
  } catch (err) {
    $("empty").hidden = false; $("empty").textContent = String(err.message || err);
    return;
  }
  const fromHash = decodeURIComponent((/^#file=(.*)$/.exec(location.hash) ?? [])[1] ?? "");
  const file = fromHash || S.plans[0]?.file;
  if (!file) { $("empty").hidden = false; $("empty").textContent = "No plan in knowledge/plan/."; return; }
  await loadPlan(file);
  listen();
})();
</script>
